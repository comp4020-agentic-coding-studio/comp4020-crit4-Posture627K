<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05060a" />
    <title>Guitar Orbit</title>
    <meta
      name="description"
      content="Guitar Orbit is a browser instrument: touch or click around the guitar to play notes that change with distance and tone that changes with angle."
    />

    <!--
      The link-preview card: public/card.png, 1200x630 --- replace it. The URL
      resolves against this page, like any link. No og:title/og:description:
      scrapers fall back to the <title> and description above.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./card.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <nav aria-label="Primary">
        <a href="./">Home</a>
      </nav>
    </header>
    <main>
      <h1>Guitar Orbit</h1>
      <p data-testid="opening-copy">Touch around the guitar to play.</p>
      <div class="orbit-stage">
        <img
          class="orbit-guitar"
          src="./guitar.svg"
          alt="Illustration of an acoustic guitar at the centre of the instrument"
        />
        <canvas data-testid="orbit-canvas" aria-hidden="true"></canvas>
      </div>
    </main>
    <footer>
      <p>Inspired by Terraria.</p>
    </footer>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
